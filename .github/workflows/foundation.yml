name: foundation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      UNIT_TEST_IDE_NATIVE_REQUIRED_TOOLCHAINS: msvc,clang-cl
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/test-service/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm prepare:cmake-bundle
      - run: pnpm test:e2e:native
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-toolchain-windows-${{ github.run_attempt }}
          path: .native-e2e/artifacts/windows/toolchain-report.json
          if-no-files-found: error
      - if: always()
        run: git diff --exit-code

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UNIT_TEST_IDE_NATIVE_REQUIRED_TOOLCHAINS: gcc,clang
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache-dependency-path: apps/test-service/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm prepare:cmake-bundle
      - run: pnpm test:e2e:native
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-toolchain-linux-${{ github.run_attempt }}
          path: .native-e2e/artifacts/linux/toolchain-report.json
          if-no-files-found: error
      - if: always()
        run: git diff --exit-code
