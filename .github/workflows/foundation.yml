name: foundation

on:
  pull_request:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version for manual packaging (for example 1.2.3)
        required: true
        type: string
      release_signing_required:
        description: Require an MSIX signature for the manual package
        required: true
        default: '0'
        type: choice
        options:
          - '0'
          - '1'
      release_input_run_id:
        description: Trusted workflow run containing the complete fixed-name Code-OSS runtime artifacts
        required: true
        type: string
      windows_code_oss_sha256:
        description: SHA-256 of root-level Code - OSS.exe in the complete code-oss-windows-x64 runtime artifact
        required: true
        type: string
      linux_code_oss_sha256:
        description: SHA-256 of runtime/code-oss in the complete code-oss-linux-x64 runtime artifact
        required: true
        type: string
      linux_appimagetool_sha256:
        description: SHA-256 of appimagetool-x86_64.AppImage in the appimagetool-linux-x64 artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  verify-windows:
    # Trusted master pushes use the dedicated WFP runner; pull requests stay on
    # the public hosted runner so fork code never reaches an administrator host.
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'unit-test-wfp' || 'windows-2025-vs2026' }}
    timeout-minutes: 60
    env:
      UNIT_TEST_IDE_NATIVE_REQUIRED_TOOLCHAINS: msvc,clang-cl
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: apps/test-service/go.sum
      - run: pnpm install --frozen-lockfile
      - id: cmake-manifest
        shell: pwsh
        run: |
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath 'tools/cmake-bundle/manifest.json').Hash.ToLowerInvariant()
          "digest=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - id: cmake-cache
        uses: actions/cache@v4
        with:
          path: .bundled-tools/cmake
          key: cmake-bundle-windows-x64-v1-${{ steps.cmake-manifest.outputs.digest }}
      - name: Prepare CMake bundle and export toolchain
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $json = node tools/cmake-bundle/prepare.mjs
            if ($LASTEXITCODE -eq 0) {
              $result = $json | ConvertFrom-Json
              break
            }
            if ($attempt -eq 3) {
              throw "CMake bundle preparation failed after $attempt attempts"
            }
            Start-Sleep -Seconds (5 * $attempt)
          }
          $cmakeBin = Split-Path -Parent $result.executable
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE=$($result.executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: pnpm verify
      - id: coverage-manifest
        shell: pwsh
        run: |
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath 'tools/coverage-bundle/manifest.json').Hash.ToLowerInvariant()
          "digest=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - id: coverage-cache
        uses: actions/cache@v4
        with:
          # Cache only immutable downloaded archives. The prepared runtime is
          # intentionally excluded because smoke/tests can create __pycache__
          # files inside it and poison a later cache hit.
          path: .superpowers/cache/coverage-bundle
          # Bump the recipe epoch when bundle layout/normalization changes; the
          # source manifest digest alone cannot invalidate a cached old layout.
          key: coverage-bundle-windows-x64-recipe-v3-${{ steps.coverage-manifest.outputs.digest }}
      - run: pnpm prepare:coverage-bundle
      - run: pnpm check:coverage-bundle
      - run: pnpm --filter @unit-test-ide/service-probe test:coverage-bundle
      # Exercise the real Named Pipe service contract. The host harness reports SKIP without CODE_OSS_EXECUTABLE.
      - run: node tools/service-probe/build-service.mjs
      # Public hosted Windows runners may not grant WFP management permission.
      # Set the repository variable to "1" only when this job runs with that privilege.
      - name: Verify privileged Windows WFP lifecycle
        env:
          UNIT_TEST_IDE_WFP_INTEGRATION_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.UNIT_TEST_IDE_WFP_INTEGRATION_REQUIRED || '0' }}
        run: go test ./apps/test-service/internal/offlineboundary -run '^TestPrivilegedWindowsWFPDynamicLifecycle$' -count=1 -v
      - name: Verify TypeScript WFP sibling sequencing
        env:
          UNIT_TEST_IDE_WFP_INTEGRATION_REQUIRED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.UNIT_TEST_IDE_WFP_INTEGRATION_REQUIRED || '0' }}
        run: pnpm --filter @unit-test-ide/service-probe test:wfp-integration
      - id: windows-coverage-smoke
        name: Verify Windows LLVM coverage execution
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.UNIT_TEST_IDE_WFP_INTEGRATION_REQUIRED == '1' }}
        env:
          UNIT_TEST_IDE_NATIVE_REQUIRED_TOOLCHAINS: clang-cl
        run: pnpm --filter code-oss-extension test:coverage-service-smoke
      - name: Legacy cleanup Windows offline boundary residue
        if: always()
        shell: pwsh
        run: |
          $stateRoot = Join-Path $PWD '.native-e2e/runtime/windows-firewall-guardians'
          & 'tools/service-probe/scripts/windows-offline-boundary.ps1' `
            -Action LegacyCleanup `
            -StateRoot $stateRoot `
            -DeadlineSeconds 60
      - run: pnpm --filter code-oss-extension test:service-smoke
      - run: pnpm --filter code-oss-extension test:benchmark
      - run: pnpm --filter code-oss-extension test:host
      # The Windows native matrix is opt-in: public hosted runners currently
      # lose the named-pipe liveness connection during the clang-cl linker
      # diagnostic scenario. Set UNIT_TEST_IDE_WINDOWS_NATIVE_E2E_REQUIRED=1
      # when a repository runner has the required stability budget.
      - name: Run Windows native E2E matrix
        if: ${{ vars.UNIT_TEST_IDE_WINDOWS_NATIVE_E2E_REQUIRED == '1' }}
        run: pnpm test:e2e:native
      - if: ${{ always() && vars.UNIT_TEST_IDE_WINDOWS_NATIVE_E2E_REQUIRED == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: native-toolchain-windows-${{ github.run_attempt }}
          path: .native-e2e/artifacts/windows/toolchain-report.json
          if-no-files-found: error
      - if: ${{ steps.windows-coverage-smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-execution-windows-${{ github.run_attempt }}
          path: .native-e2e/artifacts/windows/coverage-execution-report.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-bundle-windows-${{ github.run_attempt }}
          path: .native-e2e/artifacts/windows/coverage-bundle-report.json
          if-no-files-found: error
      - if: always()
        run: git diff --exit-code

  verify-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UNIT_TEST_IDE_NATIVE_REQUIRED_TOOLCHAINS: gcc,clang
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: apps/test-service/go.sum
      - run: pnpm install --frozen-lockfile
      - id: cmake-manifest
        shell: bash
        run: |
          digest="$(sha256sum tools/cmake-bundle/manifest.json | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: cmake-cache
        uses: actions/cache@v4
        with:
          path: .bundled-tools/cmake
          key: cmake-bundle-linux-x64-v1-${{ steps.cmake-manifest.outputs.digest }}
      - name: Prepare CMake bundle and export toolchain
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if result="$(node tools/cmake-bundle/prepare.mjs)"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "CMake bundle preparation failed after $attempt attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          cmake="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).executable)' "$result")"
          echo "$(dirname "$cmake")" >> "$GITHUB_PATH"
          echo "CMAKE=$cmake" >> "$GITHUB_ENV"
      - run: pnpm verify
      - name: Verify native Linux release contracts
        run: node --test tools/release/linux/runtime-mode-inventory.test.mjs tools/release/qualification.test.mjs tools/release/update.test.mjs tools/workspace-smoke/workspace-smoke.test.mjs
      - id: coverage-manifest
        shell: bash
        run: |
          digest="$(sha256sum tools/coverage-bundle/manifest.json | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - id: coverage-cache
        uses: actions/cache@v4
        with:
          # Cache only immutable downloaded archives. The prepared runtime is
          # intentionally excluded because smoke/tests can create __pycache__
          # files inside it and poison a later cache hit.
          path: .superpowers/cache/coverage-bundle
          # Keep the recipe epoch alongside the source lock digest so a cache
          # produced by an older prepare/check implementation is not reused.
          key: coverage-bundle-linux-x64-recipe-v3-${{ steps.coverage-manifest.outputs.digest }}
      - run: pnpm prepare:coverage-bundle
      - run: pnpm check:coverage-bundle
      - run: pnpm --filter @unit-test-ide/service-probe test:coverage-bundle
      # Exercise the real Unix Socket service contract; host smoke remains an honest SKIP without CODE_OSS_EXECUTABLE.
      - run: node tools/service-probe/build-service.mjs
      - run: pnpm --filter code-oss-extension test:service-smoke
      - run: pnpm --filter code-oss-extension test:benchmark
      - run: pnpm --filter code-oss-extension test:host
      - run: pnpm test:e2e:native
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-toolchain-linux-${{ github.run_attempt }}
          path: .native-e2e/artifacts/linux/toolchain-report.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-bundle-linux-${{ github.run_attempt }}
          path: .native-e2e/artifacts/linux/coverage-bundle-report.json
          if-no-files-found: error
      - if: always()
        run: git diff --exit-code

  verify-release-input-run:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_id: ${{ steps.verify-provenance.outputs.run_id }}
      run_attempt: ${{ steps.verify-provenance.outputs.run_attempt }}
      windows_launcher_sha256: ${{ steps.verify-provenance.outputs.windows_launcher_sha256 }}
      linux_launcher_sha256: ${{ steps.verify-provenance.outputs.linux_launcher_sha256 }}
      appimagetool_sha256: ${{ steps.verify-provenance.outputs.appimagetool_sha256 }}
      windows_artifact_id: ${{ steps.verify-provenance.outputs.windows_artifact_id }}
      windows_artifact_digest: ${{ steps.verify-provenance.outputs.windows_artifact_digest }}
      linux_artifact_id: ${{ steps.verify-provenance.outputs.linux_artifact_id }}
      linux_artifact_digest: ${{ steps.verify-provenance.outputs.linux_artifact_digest }}
      appimagetool_artifact_id: ${{ steps.verify-provenance.outputs.appimagetool_artifact_id }}
      appimagetool_artifact_digest: ${{ steps.verify-provenance.outputs.appimagetool_artifact_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.2
        with:
          node-version: 24.18.0
      - name: Select release input coordinates
        shell: bash
        env:
          RELEASE_INPUT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.release_input_run_id || vars.RELEASE_INPUT_RUN_ID }}
          WINDOWS_LAUNCHER_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_code_oss_sha256 || vars.RELEASE_CODE_OSS_WINDOWS_SHA256 }}
          LINUX_LAUNCHER_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_code_oss_sha256 || vars.RELEASE_CODE_OSS_LINUX_SHA256 }}
          APPIMAGETOOL_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_appimagetool_sha256 || vars.RELEASE_APPIMAGETOOL_LINUX_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_INPUT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'RELEASE_PRODUCER_UNTRUSTED: run ID must be canonical decimal digits' >&2; exit 1; }
          [[ "$WINDOWS_LAUNCHER_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'RELEASE_PRODUCER_PROVENANCE_INVALID: Windows launcher digest must be lowercase SHA-256' >&2; exit 1; }
          [[ "$LINUX_LAUNCHER_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'RELEASE_PRODUCER_PROVENANCE_INVALID: Linux launcher digest must be lowercase SHA-256' >&2; exit 1; }
          [[ "$APPIMAGETOOL_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'RELEASE_PRODUCER_PROVENANCE_INVALID: appimagetool digest must be lowercase SHA-256' >&2; exit 1; }
          {
            printf 'RELEASE_INPUT_RUN_ID=%s\n' "$RELEASE_INPUT_RUN_ID"
            printf 'WINDOWS_LAUNCHER_SHA256=%s\n' "$WINDOWS_LAUNCHER_SHA256"
            printf 'LINUX_LAUNCHER_SHA256=%s\n' "$LINUX_LAUNCHER_SHA256"
            printf 'APPIMAGETOOL_SHA256=%s\n' "$APPIMAGETOOL_SHA256"
          } >> "$GITHUB_ENV"
      - name: Fetch trusted producer metadata before provenance download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          verify_root='.release/producer-verification'
          [[ ! -e "$verify_root" && ! -L "$verify_root" ]] || { echo 'RELEASE_PRODUCER_UNTRUSTED: producer verification directory must be fresh' >&2; exit 1; }
          mkdir -m 700 "$verify_root"
          gh api "repos/colayc/unitTest/actions/runs/$RELEASE_INPUT_RUN_ID" > "$verify_root/producer-run-before.json"
          gh api "repos/colayc/unitTest/actions/runs/$RELEASE_INPUT_RUN_ID/artifacts?per_page=100" > "$verify_root/producer-artifacts-before.json"
          [[ -f "$verify_root/producer-run-before.json" && ! -L "$verify_root/producer-run-before.json" ]] || { echo 'RELEASE_PRODUCER_UNTRUSTED: producer run metadata is not a regular file' >&2; exit 1; }
          [[ -f "$verify_root/producer-artifacts-before.json" && ! -L "$verify_root/producer-artifacts-before.json" ]] || { echo 'RELEASE_PRODUCER_UNTRUSTED: producer artifact metadata is not a regular file' >&2; exit 1; }
      - id: precheck
        name: Validate trusted producer run before artifact download
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/producer/trusted-run.mjs validate-run \
            --run-json .release/producer-verification/producer-run-before.json \
            --artifacts-json .release/producer-verification/producer-artifacts-before.json \
            --run-id "$RELEASE_INPUT_RUN_ID" \
            --consumer-commit "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
      - name: Download trusted release input provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.precheck.outputs.provenance_artifact_id }}
          merge-multiple: true
          path: .release/producer-verification/provenance
          github-token: ${{ github.token }}
          run-id: ${{ steps.precheck.outputs.run_id }}
      - name: Refetch trusted producer metadata after provenance download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          verify_root='.release/producer-verification'
          gh api "repos/colayc/unitTest/actions/runs/$RELEASE_INPUT_RUN_ID" > "$verify_root/producer-run-after.json"
          gh api "repos/colayc/unitTest/actions/runs/$RELEASE_INPUT_RUN_ID/artifacts?per_page=100" > "$verify_root/producer-artifacts-after.json"
          [[ -f "$verify_root/producer-run-after.json" && ! -L "$verify_root/producer-run-after.json" ]] || { echo 'RELEASE_PRODUCER_UNTRUSTED: producer run metadata is not a regular file' >&2; exit 1; }
          [[ -f "$verify_root/producer-artifacts-after.json" && ! -L "$verify_root/producer-artifacts-after.json" ]] || { echo 'RELEASE_PRODUCER_UNTRUSTED: producer artifact metadata is not a regular file' >&2; exit 1; }
      - id: verify-provenance
        name: Validate trusted release input provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ -d .release/producer-verification/provenance && ! -L .release/producer-verification/provenance ]] || { echo 'RELEASE_PRODUCER_PROVENANCE_INVALID: provenance artifact root is invalid' >&2; exit 1; }
          mapfile -d '' -t provenance_entries < <(find .release/producer-verification/provenance -mindepth 1 -maxdepth 1 -printf '%f\0' | LC_ALL=C sort -z)
          ((${#provenance_entries[@]} == 1)) && [[ "${provenance_entries[0]}" == 'release-input-provenance.json' ]] || { echo 'RELEASE_PRODUCER_PROVENANCE_INVALID: provenance artifact root must contain exactly release-input-provenance.json' >&2; exit 1; }
          [[ -f .release/producer-verification/provenance/release-input-provenance.json && ! -L .release/producer-verification/provenance/release-input-provenance.json ]] || { echo 'RELEASE_PRODUCER_PROVENANCE_INVALID: provenance document is invalid' >&2; exit 1; }
          node tools/release/producer/trusted-run.mjs validate-provenance \
            --run-json .release/producer-verification/producer-run-after.json \
            --artifacts-json .release/producer-verification/producer-artifacts-after.json \
            --run-id "${{ steps.precheck.outputs.run_id }}" \
            --run-attempt "${{ steps.precheck.outputs.run_attempt }}" \
            --consumer-commit "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --provenance .release/producer-verification/provenance/release-input-provenance.json \
            --provenance-artifact-id "${{ steps.precheck.outputs.provenance_artifact_id }}" \
            --provenance-artifact-digest "${{ steps.precheck.outputs.provenance_artifact_digest }}" \
            --windows-launcher-sha256 "$WINDOWS_LAUNCHER_SHA256" \
            --linux-launcher-sha256 "$LINUX_LAUNCHER_SHA256" \
            --appimagetool-sha256 "$APPIMAGETOOL_SHA256"

  package-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - verify-windows
      - verify-linux
      - verify-release-input-run
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    outputs:
      artifact_name: release-input-windows-${{ steps.package-msix.outputs.version }}-${{ github.run_attempt }}
      version: ${{ steps.package-msix.outputs.version }}
      package_filename: ${{ steps.package-msix.outputs.package_filename }}
      package_sha256: ${{ steps.package-msix.outputs.package_sha256 }}
      manifest_filename: ${{ steps.package-msix.outputs.manifest_filename }}
      manifest_sha256: ${{ steps.package-msix.outputs.manifest_sha256 }}
      baseline_version: ${{ steps.package-msix.outputs.baseline_version }}
      baseline_package_filename: ${{ steps.package-msix.outputs.baseline_package_filename }}
      baseline_package_sha256: ${{ steps.package-msix.outputs.baseline_package_sha256 }}
      baseline_manifest_filename: ${{ steps.package-msix.outputs.baseline_manifest_filename }}
      baseline_manifest_sha256: ${{ steps.package-msix.outputs.baseline_manifest_sha256 }}
      signature_required: ${{ steps.package-msix.outputs.signature_required }}
      signature_outcome: ${{ steps.package-msix.outputs.signature_outcome }}
    env:
      RELEASE_INPUT_RUN_ID: ${{ needs.verify-release-input-run.outputs.run_id }}
      RELEASE_INPUT_RUN_ATTEMPT: ${{ needs.verify-release-input-run.outputs.run_attempt }}
      WINDOWS_ARTIFACT_ID: ${{ needs.verify-release-input-run.outputs.windows_artifact_id }}
      WINDOWS_ARTIFACT_DIGEST: ${{ needs.verify-release-input-run.outputs.windows_artifact_digest }}
      CODE_OSS_SHA256: ${{ needs.verify-release-input-run.outputs.windows_launcher_sha256 }}
      RELEASE_MSIX_PUBLISHER: ${{ vars.RELEASE_MSIX_PUBLISHER || 'CN=Unit Test IDE' }}
    steps:
      - uses: actions/checkout@v6
      - name: Require release input coordinates
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_INPUT_RUN_ID) -or $env:RELEASE_INPUT_RUN_ID -cnotmatch '^\d+$') {
            throw 'RELEASE_INPUT_MISSING: RELEASE_INPUT_RUN_ID must identify a trusted artifact-producing run'
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_INPUT_RUN_ATTEMPT) -or $env:RELEASE_INPUT_RUN_ATTEMPT -cnotmatch '^[1-9]\d*$') {
            throw 'RELEASE_INPUT_MISSING: RELEASE_INPUT_RUN_ATTEMPT must identify the trusted producer attempt'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_ARTIFACT_ID) -or $env:WINDOWS_ARTIFACT_ID -cnotmatch '^[1-9]\d*$') {
            throw 'RELEASE_INPUT_MISSING: WINDOWS_ARTIFACT_ID must identify the trusted Windows runtime artifact'
          }
          if ($env:WINDOWS_ARTIFACT_DIGEST -cnotmatch '^[0-9a-f]{64}$') {
            throw 'RELEASE_INPUT_MISSING: WINDOWS_ARTIFACT_DIGEST must bind the trusted Windows runtime artifact'
          }
          if ($env:CODE_OSS_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'RELEASE_INPUT_MISSING: CODE_OSS_SHA256 must pin root-level code-oss-windows-x64/Code - OSS.exe'
          }
      - name: Validate producer attempt before Windows artifact download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path '.release' | Out-Null
          gh api "repos/colayc/unitTest/actions/runs/$env:RELEASE_INPUT_RUN_ID" > .release/producer-run-windows-before.json
          node tools/release/producer/trusted-run.mjs validate-attempt `
            --run-json .release/producer-run-windows-before.json `
            --run-id $env:RELEASE_INPUT_RUN_ID `
            --run-attempt $env:RELEASE_INPUT_RUN_ATTEMPT `
            --consumer-commit $env:GITHUB_SHA
      - name: Download trusted Windows Code-OSS runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify-release-input-run.outputs.windows_artifact_id }}
          merge-multiple: true
          path: .release/inputs/windows-code-oss
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-release-input-run.outputs.run_id }}
      - name: Validate producer attempt after Windows artifact download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/colayc/unitTest/actions/runs/$env:RELEASE_INPUT_RUN_ID" > .release/producer-run-windows-after.json
          node tools/release/producer/trusted-run.mjs validate-attempt `
            --run-json .release/producer-run-windows-after.json `
            --run-id $env:RELEASE_INPUT_RUN_ID `
            --run-attempt $env:RELEASE_INPUT_RUN_ATTEMPT `
            --consumer-commit $env:GITHUB_SHA
      - name: Verify and export release inputs
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $PWD '.release/inputs/windows-code-oss'
          $launcher = Join-Path $runtimeRoot 'Code - OSS.exe'
          $matches = @(Get-ChildItem -LiteralPath $runtimeRoot -File | Where-Object Name -CEQ 'Code - OSS.exe')
          if ($matches.Count -ne 1 -or -not (Test-Path -LiteralPath $launcher -PathType Leaf)) {
            throw 'RELEASE_INPUT_MISSING: code-oss-windows-x64 must contain root-level Code - OSS.exe'
          }
          $actual = (Get-FileHash -LiteralPath $launcher -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:CODE_OSS_SHA256) { throw 'RELEASE_INPUT_MISSING: Code - OSS.exe digest does not match CODE_OSS_SHA256' }
          $sourceDateEpoch = (git show -s --format=%ct HEAD).Trim()
          if ($sourceDateEpoch -cnotmatch '^(?:0|[1-9]\d*)$') { throw 'RELEASE_INPUT_MISSING: source commit has no canonical SOURCE_DATE_EPOCH' }
          "CODE_OSS_RUNTIME_ROOT=$runtimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_DATE_EPOCH=$sourceDateEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: apps/test-service/go.sum
      - run: pnpm install --frozen-lockfile
      - id: cmake-bundle
        name: Prepare CMake bundle
        shell: pwsh
        run: |
          $result = node tools/cmake-bundle/prepare.mjs | ConvertFrom-Json
          $cmakeBin = Split-Path -Parent $result.executable
          $cmakeRoot = Split-Path -Parent (Split-Path -Parent $result.executable)
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CMAKE=$($result.executable)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "cmake_root=$cmakeRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - run: pnpm prepare:coverage-bundle
      - run: pnpm build
      - name: Build Windows service binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.release/windows' | Out-Null
          go build -o '.release/windows/unit-test-service.exe' ./apps/test-service/cmd/unit-test-service
      - name: Materialize MSIX signing certificate
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_signing_required == '1' }}
        shell: pwsh
        env:
          RELEASE_SIGNING_PFX_BASE64: ${{ secrets.RELEASE_SIGNING_PFX_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_SIGNING_PFX_BASE64)) {
            throw 'RELEASE_SIGNING_PFX_BASE64 is required when signing is enabled'
          }
          $certificateBytes = [Convert]::FromBase64String($env:RELEASE_SIGNING_PFX_BASE64)
          $certificatePath = Join-Path $PWD '.release/windows/release-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "RELEASE_SIGNING_PFX_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - id: package-msix
        name: Stage and package Windows MSIX
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
          RELEASE_SIGNING_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || inputs.release_signing_required }}
          RELEASE_SIGNING_PFX_PASSWORD: ${{ secrets.RELEASE_SIGNING_PFX_PASSWORD }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:RELEASE_VERSION
          } else {
            if (-not $env:RELEASE_VERSION.StartsWith('v')) {
              throw "tag release version must start with 'v': $env:RELEASE_VERSION"
            }
            $version = $env:RELEASE_VERSION.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "release version must be semver-like: $version"
          }
          $core = $version.Split('-', 2)[0].Split('+', 2)[0].Split('.') | ForEach-Object { [int]$_ }
          if ($core[2] -gt 0) { $baselineVersion = "$($core[0]).$($core[1]).$($core[2] - 1)" }
          elseif ($core[1] -gt 0) { $baselineVersion = "$($core[0]).$($core[1] - 1).0" }
          elseif ($core[0] -gt 0) { $baselineVersion = "$($core[0] - 1).0.0" }
          else { $baselineVersion = '0.0.0-0' }
          if ($baselineVersion -eq $version) { throw "release version has no lower smoke baseline: $version" }
          $stagingRoot = node tools/release/stage.mjs `
            --platform windows `
            --architecture x64 `
            --version $version `
            --code-oss-root $env:CODE_OSS_RUNTIME_ROOT `
            --code-oss-sha256 $env:CODE_OSS_SHA256 `
            --service '.release/windows/unit-test-service.exe' `
            --cmake-root '${{ steps.cmake-bundle.outputs.cmake_root }}' `
            --coverage-root '.superpowers/runtime/coverage-bundle/windows-x64' `
            --out '.release/windows/dist'
          $stagingRoot = $stagingRoot.Trim()
          $packagePath = Join-Path $PWD ".release/windows/dist/unit-test-ide-$version.msix"
          & 'tools/release/windows/package-msix.ps1' `
            -StagingRoot $stagingRoot `
            -Output $packagePath `
            -Version $version `
            -Publisher $env:RELEASE_MSIX_PUBLISHER | Out-Null
          $manifestPath = Join-Path $PWD ".release/windows/dist/unit-test-ide-$version.release-manifest.json"
          Copy-Item -LiteralPath (Join-Path $stagingRoot 'release-manifest.json') -Destination $manifestPath
          $baselineStagingRoot = node tools/release/stage.mjs `
            --platform windows `
            --architecture x64 `
            --version $baselineVersion `
            --code-oss-root $env:CODE_OSS_RUNTIME_ROOT `
            --code-oss-sha256 $env:CODE_OSS_SHA256 `
            --service '.release/windows/unit-test-service.exe' `
            --cmake-root '${{ steps.cmake-bundle.outputs.cmake_root }}' `
            --coverage-root '.superpowers/runtime/coverage-bundle/windows-x64' `
            --out '.release/windows/dist'
          $baselineStagingRoot = $baselineStagingRoot.Trim()
          $baselinePackagePath = Join-Path $PWD ".release/windows/dist/unit-test-ide-$baselineVersion.msix"
          & 'tools/release/windows/package-msix.ps1' `
            -StagingRoot $baselineStagingRoot `
            -Output $baselinePackagePath `
            -Version $baselineVersion `
            -Publisher $env:RELEASE_MSIX_PUBLISHER | Out-Null
          $baselineManifestPath = Join-Path $PWD ".release/windows/dist/unit-test-ide-$baselineVersion.release-manifest.json"
          Copy-Item -LiteralPath (Join-Path $baselineStagingRoot 'release-manifest.json') -Destination $baselineManifestPath
          $licenseAuditPath = Join-Path $PWD '.release/windows/dist/license-audit-windows.json'
          node tools/release/license-audit.mjs `
            --staging-root $stagingRoot `
            --out $licenseAuditPath | Out-Null
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_path=$packagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_filename=$(Split-Path -Leaf $packagePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package_sha256=$((Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_path=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_filename=$(Split-Path -Leaf $manifestPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest_sha256=$((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline_version=$baselineVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline_package_path=$baselinePackagePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline_package_filename=$(Split-Path -Leaf $baselinePackagePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline_package_sha256=$((Get-FileHash -LiteralPath $baselinePackagePath -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline_manifest_path=$baselineManifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline_manifest_filename=$(Split-Path -Leaf $baselineManifestPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "baseline_manifest_sha256=$((Get-FileHash -LiteralPath $baselineManifestPath -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "license_audit_path=$licenseAuditPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature_required=$env:RELEASE_SIGNING_REQUIRED" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "signature_outcome=$(if ($env:RELEASE_SIGNING_REQUIRED -eq '1') { 'verified' } else { 'not-required' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@v7
        with:
          name: release-input-windows-${{ steps.package-msix.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package-msix.outputs.package_path }}
            ${{ steps.package-msix.outputs.manifest_path }}
            ${{ steps.package-msix.outputs.baseline_package_path }}
            ${{ steps.package-msix.outputs.baseline_manifest_path }}
            ${{ steps.package-msix.outputs.license_audit_path }}
          if-no-files-found: error
          retention-days: 1

  package-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - verify-windows
      - verify-linux
      - verify-release-input-run
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_name: release-input-linux-${{ steps.package-appimage.outputs.version }}-${{ github.run_attempt }}
      version: ${{ steps.package-appimage.outputs.version }}
      package_filename: ${{ steps.package-appimage.outputs.package_filename }}
      package_sha256: ${{ steps.package-appimage.outputs.package_sha256 }}
      manifest_filename: ${{ steps.package-appimage.outputs.manifest_filename }}
      manifest_sha256: ${{ steps.package-appimage.outputs.manifest_sha256 }}
      release_manifest_filename: ${{ steps.package-appimage.outputs.release_manifest_filename }}
      release_manifest_sha256: ${{ steps.package-appimage.outputs.release_manifest_sha256 }}
      baseline_version: ${{ steps.package-appimage.outputs.baseline_version }}
      baseline_package_filename: ${{ steps.package-appimage.outputs.baseline_package_filename }}
      baseline_package_sha256: ${{ steps.package-appimage.outputs.baseline_package_sha256 }}
      baseline_manifest_filename: ${{ steps.package-appimage.outputs.baseline_manifest_filename }}
      baseline_manifest_sha256: ${{ steps.package-appimage.outputs.baseline_manifest_sha256 }}
      baseline_release_manifest_filename: ${{ steps.package-appimage.outputs.baseline_release_manifest_filename }}
    env:
      RELEASE_INPUT_RUN_ID: ${{ needs.verify-release-input-run.outputs.run_id }}
      RELEASE_INPUT_RUN_ATTEMPT: ${{ needs.verify-release-input-run.outputs.run_attempt }}
      LINUX_ARTIFACT_ID: ${{ needs.verify-release-input-run.outputs.linux_artifact_id }}
      LINUX_ARTIFACT_DIGEST: ${{ needs.verify-release-input-run.outputs.linux_artifact_digest }}
      APPIMAGETOOL_ARTIFACT_ID: ${{ needs.verify-release-input-run.outputs.appimagetool_artifact_id }}
      APPIMAGETOOL_ARTIFACT_DIGEST: ${{ needs.verify-release-input-run.outputs.appimagetool_artifact_digest }}
      CODE_OSS_SHA256: ${{ needs.verify-release-input-run.outputs.linux_launcher_sha256 }}
      APPIMAGETOOL_SHA256: ${{ needs.verify-release-input-run.outputs.appimagetool_sha256 }}
    steps:
      - uses: actions/checkout@v6
      - name: Require release input coordinates
        shell: bash
        run: |
          [[ "${RELEASE_INPUT_RUN_ID:-}" =~ ^[0-9]+$ ]] || { echo 'RELEASE_INPUT_MISSING: RELEASE_INPUT_RUN_ID must identify a trusted artifact-producing run' >&2; exit 1; }
          [[ "${RELEASE_INPUT_RUN_ATTEMPT:-}" =~ ^[1-9][0-9]*$ ]] || { echo 'RELEASE_INPUT_MISSING: RELEASE_INPUT_RUN_ATTEMPT must identify the trusted producer attempt' >&2; exit 1; }
          [[ "${LINUX_ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]] || { echo 'RELEASE_INPUT_MISSING: LINUX_ARTIFACT_ID must identify the trusted Linux runtime artifact' >&2; exit 1; }
          [[ "${LINUX_ARTIFACT_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] || { echo 'RELEASE_INPUT_MISSING: LINUX_ARTIFACT_DIGEST must bind the trusted Linux runtime artifact' >&2; exit 1; }
          [[ "${APPIMAGETOOL_ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]] || { echo 'RELEASE_INPUT_MISSING: APPIMAGETOOL_ARTIFACT_ID must identify the trusted appimagetool artifact' >&2; exit 1; }
          [[ "${APPIMAGETOOL_ARTIFACT_DIGEST:-}" =~ ^[0-9a-f]{64}$ ]] || { echo 'RELEASE_INPUT_MISSING: APPIMAGETOOL_ARTIFACT_DIGEST must bind the trusted appimagetool artifact' >&2; exit 1; }
          [[ "${CODE_OSS_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || { echo 'RELEASE_INPUT_MISSING: CODE_OSS_SHA256 must pin code-oss-linux-x64/code-oss' >&2; exit 1; }
          [[ "${APPIMAGETOOL_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] || { echo 'RELEASE_INPUT_MISSING: APPIMAGETOOL_SHA256 must pin appimagetool-linux-x64/appimagetool-x86_64.AppImage' >&2; exit 1; }
      - name: Validate producer attempt before Linux artifact download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .release
          gh api "repos/colayc/unitTest/actions/runs/$RELEASE_INPUT_RUN_ID" > .release/producer-run-linux-before.json
          node tools/release/producer/trusted-run.mjs validate-attempt \
            --run-json .release/producer-run-linux-before.json \
            --run-id "$RELEASE_INPUT_RUN_ID" \
            --run-attempt "$RELEASE_INPUT_RUN_ATTEMPT" \
            --consumer-commit "$GITHUB_SHA"
      - name: Download trusted Linux Code-OSS runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify-release-input-run.outputs.linux_artifact_id }}
          merge-multiple: true
          path: .release/inputs/linux-code-oss
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-release-input-run.outputs.run_id }}
      - name: Download trusted Linux appimagetool
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify-release-input-run.outputs.appimagetool_artifact_id }}
          merge-multiple: true
          path: .release/inputs/linux-appimagetool
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-release-input-run.outputs.run_id }}
      - name: Validate producer attempt after Linux artifact download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/colayc/unitTest/actions/runs/$RELEASE_INPUT_RUN_ID" > .release/producer-run-linux-after.json
          node tools/release/producer/trusted-run.mjs validate-attempt \
            --run-json .release/producer-run-linux-after.json \
            --run-id "$RELEASE_INPUT_RUN_ID" \
            --run-attempt "$RELEASE_INPUT_RUN_ATTEMPT" \
            --consumer-commit "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Verify and export release inputs
        shell: bash
        run: |
          input_root="$PWD/.release/inputs/linux-code-oss"
          runtime_root="$input_root/runtime"
          inventory="$input_root/code-oss-runtime-mode.json"
          launcher="$runtime_root/code-oss"
          mapfile -t runtime_artifact_entries < <(find "$input_root" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          ((${#runtime_artifact_entries[@]} == 2)) && [[ "${runtime_artifact_entries[0]}" == 'code-oss-runtime-mode.json' && "${runtime_artifact_entries[1]}" == 'runtime' ]] || { echo 'RELEASE_INPUT_INVALID: code-oss-linux-x64 must contain only runtime/ and code-oss-runtime-mode.json' >&2; exit 1; }
          [[ -d "$runtime_root" && ! -L "$runtime_root" && -f "$inventory" && ! -L "$inventory" ]] || { echo 'RELEASE_INPUT_INVALID: Linux runtime artifact layout is invalid' >&2; exit 1; }
          [[ -f "$launcher" && ! -L "$launcher" ]] || { echo 'RELEASE_INPUT_MISSING: code-oss-linux-x64 must contain runtime/code-oss' >&2; exit 1; }
          mapfile -t appimagetool_matches < <(find .release/inputs/linux-appimagetool -type f -name appimagetool-x86_64.AppImage -print)
          ((${#appimagetool_matches[@]} == 1)) || { echo 'RELEASE_INPUT_MISSING: appimagetool-linux-x64 must contain exactly one appimagetool-x86_64.AppImage' >&2; exit 1; }
          [[ "$(sha256sum "$launcher" | cut -d' ' -f1)" == "$CODE_OSS_SHA256" ]] || { echo 'RELEASE_INPUT_MISSING: code-oss digest does not match CODE_OSS_SHA256' >&2; exit 1; }
          [[ "$(sha256sum "${appimagetool_matches[0]}" | cut -d' ' -f1)" == "$APPIMAGETOOL_SHA256" ]] || { echo 'RELEASE_INPUT_MISSING: appimagetool digest does not match APPIMAGETOOL_SHA256' >&2; exit 1; }
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          [[ "$source_date_epoch" =~ ^(0|[1-9][0-9]*)$ ]] || { echo 'RELEASE_INPUT_MISSING: source commit has no canonical SOURCE_DATE_EPOCH' >&2; exit 1; }
          chmod u+x "${appimagetool_matches[0]}"
          node tools/release/linux/runtime-mode-inventory.mjs restore \
            --root "$runtime_root" \
            --inventory "$inventory" \
            --launcher-sha256 "$CODE_OSS_SHA256" >/dev/null
          [[ -x "$launcher" ]] || { echo 'RELEASE_INPUT_INVALID: runtime/code-oss must be executable after mode restoration' >&2; exit 1; }
          echo "CODE_OSS_RUNTIME_ROOT=$runtime_root" >> "$GITHUB_ENV"
          echo "RELEASE_APPIMAGETOOL_PATH=$PWD/${appimagetool_matches[0]}" >> "$GITHUB_ENV"
          echo "RELEASE_APPIMAGETOOL_SHA256=$APPIMAGETOOL_SHA256" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$source_date_epoch" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: apps/test-service/go.sum
      - run: pnpm install --frozen-lockfile
      - id: cmake-bundle
        name: Prepare CMake bundle
        shell: bash
        run: |
          result="$(node tools/cmake-bundle/prepare.mjs)"
          cmake="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).executable)' "$result")"
          cmake_root="$(dirname "$(dirname "$cmake")")"
          echo "$(dirname "$cmake")" >> "$GITHUB_PATH"
          echo "CMAKE=$cmake" >> "$GITHUB_ENV"
          echo "cmake_root=$cmake_root" >> "$GITHUB_OUTPUT"
      - run: pnpm prepare:coverage-bundle
      - run: pnpm build
      - name: Build Linux service binary
        shell: bash
        run: |
          mkdir -p .release/linux
          go build -o .release/linux/unit-test-service ./apps/test-service/cmd/unit-test-service
      - id: package-appimage
        name: Stage and package Linux AppImage
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$RELEASE_VERSION"
          else
            if [[ "$RELEASE_VERSION" != v* ]]; then
              echo "tag release version must start with 'v': $RELEASE_VERSION" >&2
              exit 1
            fi
            version="${RELEASE_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release version must be semver-like: $version" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<<"${version%%[-+]*}"
          if ((10#$patch > 0)); then baseline_version="$major.$minor.$((10#$patch - 1))"
          elif ((10#$minor > 0)); then baseline_version="$major.$((10#$minor - 1)).0"
          elif ((10#$major > 0)); then baseline_version="$((10#$major - 1)).0.0"
          else baseline_version='0.0.0-0'
          fi
          [[ "$baseline_version" != "$version" ]] || { echo "release version has no lower smoke baseline: $version" >&2; exit 1; }
          staging_root="$(node tools/release/stage.mjs \
            --platform linux \
            --architecture x64 \
            --version "$version" \
            --code-oss-root "$CODE_OSS_RUNTIME_ROOT" \
            --code-oss-sha256 "$CODE_OSS_SHA256" \
            --service .release/linux/unit-test-service \
            --cmake-root "${{ steps.cmake-bundle.outputs.cmake_root }}" \
            --coverage-root .superpowers/runtime/coverage-bundle/linux-x64 \
            --out .release/linux/dist)"
          package_json="$(node tools/release/linux/package-appimage.mjs \
            --staging-root "$staging_root" \
            --output ".release/linux/dist/unit-test-ide-$version.AppImage" \
            --appimagetool "$RELEASE_APPIMAGETOOL_PATH" \
            --version "$version" \
            --architecture x64)"
          image_path="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).image)' "$package_json")"
          manifest_path="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).manifestPath)' "$package_json")"
          release_manifest_path="$PWD/.release/linux/dist/unit-test-ide-$version.release-manifest.json"
          cp -- "$staging_root/release-manifest.json" "$release_manifest_path"
          baseline_staging_root="$(node tools/release/stage.mjs \
            --platform linux \
            --architecture x64 \
            --version "$baseline_version" \
            --code-oss-root "$CODE_OSS_RUNTIME_ROOT" \
            --code-oss-sha256 "$CODE_OSS_SHA256" \
            --service .release/linux/unit-test-service \
            --cmake-root "${{ steps.cmake-bundle.outputs.cmake_root }}" \
            --coverage-root .superpowers/runtime/coverage-bundle/linux-x64 \
            --out .release/linux/dist)"
          baseline_package_json="$(node tools/release/linux/package-appimage.mjs \
            --staging-root "$baseline_staging_root" \
            --output ".release/linux/dist/unit-test-ide-$baseline_version.AppImage" \
            --appimagetool "$RELEASE_APPIMAGETOOL_PATH" \
            --version "$baseline_version" \
            --architecture x64)"
          baseline_image_path="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).image)' "$baseline_package_json")"
          baseline_manifest_path="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).manifestPath)' "$baseline_package_json")"
          baseline_release_manifest_path="$PWD/.release/linux/dist/unit-test-ide-$baseline_version.release-manifest.json"
          cp -- "$baseline_staging_root/release-manifest.json" "$baseline_release_manifest_path"
          license_audit_path="$PWD/.release/linux/dist/license-audit-linux.json"
          node tools/release/license-audit.mjs \
            --staging-root "$staging_root" \
            --out "$license_audit_path" >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_path=$image_path" >> "$GITHUB_OUTPUT"
          echo "package_filename=$(basename "$image_path")" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).packageSha256)' "$manifest_path")" >> "$GITHUB_OUTPUT"
          echo "manifest_path=$manifest_path" >> "$GITHUB_OUTPUT"
          echo "manifest_filename=$(basename "$manifest_path")" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).releaseManifestSha256)' "$manifest_path")" >> "$GITHUB_OUTPUT"
          echo "release_manifest_path=$release_manifest_path" >> "$GITHUB_OUTPUT"
          echo "release_manifest_filename=$(basename "$release_manifest_path")" >> "$GITHUB_OUTPUT"
          echo "release_manifest_sha256=$(sha256sum "$release_manifest_path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "baseline_version=$baseline_version" >> "$GITHUB_OUTPUT"
          echo "baseline_package_path=$baseline_image_path" >> "$GITHUB_OUTPUT"
          echo "baseline_package_filename=$(basename "$baseline_image_path")" >> "$GITHUB_OUTPUT"
          echo "baseline_package_sha256=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).packageSha256)' "$baseline_manifest_path")" >> "$GITHUB_OUTPUT"
          echo "baseline_manifest_path=$baseline_manifest_path" >> "$GITHUB_OUTPUT"
          echo "baseline_manifest_filename=$(basename "$baseline_manifest_path")" >> "$GITHUB_OUTPUT"
          echo "baseline_manifest_sha256=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).releaseManifestSha256)' "$baseline_manifest_path")" >> "$GITHUB_OUTPUT"
          echo "baseline_release_manifest_path=$baseline_release_manifest_path" >> "$GITHUB_OUTPUT"
          echo "baseline_release_manifest_filename=$(basename "$baseline_release_manifest_path")" >> "$GITHUB_OUTPUT"
          echo "license_audit_path=$license_audit_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-input-linux-${{ steps.package-appimage.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ steps.package-appimage.outputs.package_path }}
            ${{ steps.package-appimage.outputs.manifest_path }}
            ${{ steps.package-appimage.outputs.release_manifest_path }}
            ${{ steps.package-appimage.outputs.baseline_package_path }}
            ${{ steps.package-appimage.outputs.baseline_manifest_path }}
            ${{ steps.package-appimage.outputs.baseline_release_manifest_path }}
            ${{ steps.package-appimage.outputs.license_audit_path }}
          if-no-files-found: error
          retention-days: 1

  install-smoke-windows:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - package-windows
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download produced Windows package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package-windows.outputs.artifact_name }}
          path: .release/smoke-input
      - name: Exercise disposable Windows install lifecycle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.release/evidence' | Out-Null
          function Find-SmokeInput([string]$Name) {
            $matches = @(Get-ChildItem -LiteralPath '.release/smoke-input' -Recurse -File | Where-Object Name -CEQ $Name)
            if ($matches.Count -ne 1) { throw "expected exactly one downloaded package input named $Name" }
            return $matches[0].FullName
          }
          & 'tools/release/install-smoke.ps1' `
            -Root (Join-Path $env:RUNNER_TEMP 'unit-test-ide-install-smoke') `
            -EvidencePath '.release/evidence/install-smoke-windows.json' `
            -PackagePath (Find-SmokeInput '${{ needs.package-windows.outputs.package_filename }}') `
            -PackageSha256 '${{ needs.package-windows.outputs.package_sha256 }}' `
            -ManifestPath (Find-SmokeInput '${{ needs.package-windows.outputs.manifest_filename }}') `
            -ManifestSha256 '${{ needs.package-windows.outputs.manifest_sha256 }}' `
            -Version '${{ needs.package-windows.outputs.version }}' `
            -BaselinePackagePath (Find-SmokeInput '${{ needs.package-windows.outputs.baseline_package_filename }}') `
            -BaselinePackageSha256 '${{ needs.package-windows.outputs.baseline_package_sha256 }}' `
            -BaselineManifestPath (Find-SmokeInput '${{ needs.package-windows.outputs.baseline_manifest_filename }}') `
            -BaselineManifestSha256 '${{ needs.package-windows.outputs.baseline_manifest_sha256 }}' `
            -BaselineVersion '${{ needs.package-windows.outputs.baseline_version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: install-smoke-windows-${{ github.run_attempt }}
          path: .release/evidence/install-smoke-windows.json
          if-no-files-found: error
          retention-days: 1

  install-smoke-linux:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download produced Linux package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package-linux.outputs.artifact_name }}
          path: .release/smoke-input
      - name: Exercise disposable Linux install lifecycle
        shell: bash
        run: |
          mkdir -p .release/evidence
          find_input() {
            local name="$1" matches
            mapfile -t matches < <(find .release/smoke-input -type f -name "$name" -print)
            ((${#matches[@]} == 1)) || { echo "expected exactly one downloaded package input named $name" >&2; exit 1; }
            printf '%s\n' "${matches[0]}"
          }
          bash tools/release/install-smoke.sh \
            --root "$RUNNER_TEMP/unit-test-ide-install-smoke" \
            --evidence .release/evidence/install-smoke-linux.json \
            --package "$(find_input '${{ needs.package-linux.outputs.package_filename }}')" \
            --package-sha256 '${{ needs.package-linux.outputs.package_sha256 }}' \
            --manifest "$(find_input '${{ needs.package-linux.outputs.manifest_filename }}')" \
            --manifest-sha256 '${{ needs.package-linux.outputs.manifest_sha256 }}' \
            --version '${{ needs.package-linux.outputs.version }}' \
            --baseline-package "$(find_input '${{ needs.package-linux.outputs.baseline_package_filename }}')" \
            --baseline-package-sha256 '${{ needs.package-linux.outputs.baseline_package_sha256 }}' \
            --baseline-manifest "$(find_input '${{ needs.package-linux.outputs.baseline_manifest_filename }}')" \
            --baseline-manifest-sha256 '${{ needs.package-linux.outputs.baseline_manifest_sha256 }}' \
            --baseline-version '${{ needs.package-linux.outputs.baseline_version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: install-smoke-linux-${{ github.run_attempt }}
          path: .release/evidence/install-smoke-linux.json
          if-no-files-found: error
          retention-days: 1

  release-qualification:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - install-smoke-windows
      - install-smoke-linux
      - package-windows
      - package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download Windows release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package-windows.outputs.artifact_name }}
          path: .release/qualification/windows
      - name: Download Linux release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.package-linux.outputs.artifact_name }}
          path: .release/qualification/linux
      - name: Download Windows install evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-smoke-windows-${{ github.run_attempt }}
          path: .release/qualification/windows-evidence
      - name: Download Linux install evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-smoke-linux-${{ github.run_attempt }}
          path: .release/qualification/linux-evidence
      - id: qualify-release
        name: Build closed release qualification evidence
        continue-on-error: true
        shell: bash
        run: |
          find_input() {
            local root="$1" name="$2" matches
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)
            ((${#matches[@]} == 1)) || { echo "expected exactly one qualification input named $name" >&2; exit 1; }
            printf '%s\n' "${matches[0]}"
          }
          mkdir -p .release/evidence
          node tools/release/qualification.mjs \
            --linux-evidence "$(find_input .release/qualification/linux-evidence install-smoke-linux.json)" \
            --windows-evidence "$(find_input .release/qualification/windows-evidence install-smoke-windows.json)" \
            --linux-manifest "$(find_input .release/qualification/linux '${{ needs.package-linux.outputs.release_manifest_filename }}')" \
            --windows-manifest "$(find_input .release/qualification/windows '${{ needs.package-windows.outputs.manifest_filename }}')" \
            --linux-package "$(find_input .release/qualification/linux '${{ needs.package-linux.outputs.package_filename }}')" \
            --windows-package "$(find_input .release/qualification/windows '${{ needs.package-windows.outputs.package_filename }}')" \
            --linux-baseline-manifest "$(find_input .release/qualification/linux '${{ needs.package-linux.outputs.baseline_release_manifest_filename }}')" \
            --windows-baseline-manifest "$(find_input .release/qualification/windows '${{ needs.package-windows.outputs.baseline_manifest_filename }}')" \
            --linux-baseline-package "$(find_input .release/qualification/linux '${{ needs.package-linux.outputs.baseline_package_filename }}')" \
            --windows-baseline-package "$(find_input .release/qualification/windows '${{ needs.package-windows.outputs.baseline_package_filename }}')" \
            --linux-license-audit "$(find_input .release/qualification/linux license-audit-linux.json)" \
            --windows-license-audit "$(find_input .release/qualification/windows license-audit-windows.json)" \
            --windows-signature-required '${{ needs.package-windows.outputs.signature_required }}' \
            --windows-signature-outcome '${{ needs.package-windows.outputs.signature_outcome }}' \
            --out .release/evidence/release-qualification.json
      - name: Publish qualification evidence
        if: ${{ always() && hashFiles('.release/evidence/release-qualification.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-qualification-${{ github.run_attempt }}
          path: .release/evidence/release-qualification.json
          if-no-files-found: error
          retention-days: 1
      - name: Require a qualified release before publication
        if: always()
        shell: bash
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const report = JSON.parse(readFileSync(".release/evidence/release-qualification.json", "utf8"));
            if (report.qualificationOutcome.qualified !== true) {
              console.error(JSON.stringify(report.qualificationOutcome.reasons));
              process.exit(1);
            }
          '
      - id: canonical-release-version
        name: Export canonical qualified release version
        shell: bash
        env:
          LINUX_RELEASE_VERSION: ${{ needs.package-linux.outputs.version }}
          WINDOWS_RELEASE_VERSION: ${{ needs.package-windows.outputs.version }}
        run: |
          if [[ "$LINUX_RELEASE_VERSION" != "$WINDOWS_RELEASE_VERSION" ]]; then
            echo "qualified platform versions diverged" >&2
            exit 1
          fi
          echo "version=$WINDOWS_RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Stage qualified release files
        shell: bash
        run: |
          find_input() {
            local root="$1" name="$2" matches
            mapfile -t matches < <(find "$root" -type f -name "$name" -print)
            ((${#matches[@]} == 1)) || { echo "expected exactly one qualified release input named $name" >&2; exit 1; }
            printf '%s\n' "${matches[0]}"
          }
          mkdir -p .release/qualified
          cp -- "$(find_input .release/qualification/windows '${{ needs.package-windows.outputs.package_filename }}')" .release/qualified/
          cp -- "$(find_input .release/qualification/windows '${{ needs.package-windows.outputs.manifest_filename }}')" .release/qualified/
          cp -- "$(find_input .release/qualification/windows license-audit-windows.json)" .release/qualified/
          cp -- "$(find_input .release/qualification/linux '${{ needs.package-linux.outputs.package_filename }}')" .release/qualified/
          cp -- "$(find_input .release/qualification/linux '${{ needs.package-linux.outputs.manifest_filename }}')" .release/qualified/
          cp -- "$(find_input .release/qualification/linux '${{ needs.package-linux.outputs.release_manifest_filename }}')" .release/qualified/
          cp -- "$(find_input .release/qualification/linux license-audit-linux.json)" .release/qualified/
          cp -- .release/evidence/release-qualification.json .release/qualified/
      - name: Publish qualified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qualified-release-${{ steps.canonical-release-version.outputs.version }}-${{ github.run_attempt }}
          path: .release/qualified
          if-no-files-found: error
          retention-days: 1
